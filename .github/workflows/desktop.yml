name: Desktop

# A version tag builds the installers, after the tests, and attaches them to a GitHub Release. Run by hand from the
# Actions tab, it only builds them, as artifacts of the run. Installers are unsigned for now.
on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    uses: ./.github/workflows/backend.yml

  frontend:
    uses: ./.github/workflows/frontend.yml

  build:
    needs: [ backend, frontend ]
    strategy:
      fail-fast: false
      matrix:
        include:
          # A Mac installer can only be built on a Mac, and the Java runtime it ships matches the runner's CPU.
          - name: windows-x64
            runner: windows-latest
          - name: mac-arm64
            runner: macos-14
          - name: mac-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build the installer
        shell: bash
        working-directory: backend
        run: ./mvnw --no-transfer-progress -DskipTests package -P with-frontend,desktop

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: kafkador-${{ matrix.name }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Attach them to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # A tag like v1.2.3-rc.1 is a pre-release.
          prerelease=""
          if [[ "$TAG" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$TAG" installers/* --title "Kafkador ${TAG#v}" --generate-notes $prerelease

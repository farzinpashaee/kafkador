name: Docs

# Builds website/ and copies the static files to the VPS that serves kafkador.codestreamlab.com/docs/. It needs the
# DOCS_SSH_KEY, DOCS_SSH_HOST, DOCS_SSH_USER and DOCS_PATH repository secrets; see website/README.md.
on:
  push:
    branches: [ main ]
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build the site
        working-directory: website
        run: |
          npm ci
          npm run build

      - name: Copy it to the VPS
        working-directory: website
        env:
          SSH_KEY: ${{ secrets.DOCS_SSH_KEY }}
          SSH_HOST: ${{ secrets.DOCS_SSH_HOST }}
          SSH_USER: ${{ secrets.DOCS_SSH_USER }}
          DOCS_PATH: ${{ secrets.DOCS_PATH }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          rsync -az --delete build/ "$SSH_USER@$SSH_HOST:$DOCS_PATH/"

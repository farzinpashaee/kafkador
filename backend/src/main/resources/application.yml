kafkador:
  connectionServiceImplementation:
  # Where first-run setup (see DatabaseCredentialsService) saves the chosen embedded-database
  # username/password, and where every later startup reads them from before the datasource connects
  # (DbCredentialsEnvironmentPostProcessor). Deleting this file does NOT undo the change in the
  # database itself — only the setup wizard's own ALTER USER can do that.
  db-credentials-file: ./data/db-credentials.properties
  # First-run setup can't be claimed by whoever reaches a new instance first (see SetupGuard): set the database
  # credentials up front (KAFKADOR_SETUP_USERNAME / KAFKADOR_SETUP_PASSWORD) to skip the setup page, or the page asks
  # for a one-time token printed to the log at startup (KAFKADOR_SETUP_TOKEN to choose it).
  setup:
    username: ""
    password: ""
    token: ""
    require-token: true
  observerService: # TODO: move to database enable per cluster. the config record must create when the cluster record created
    enabled: false
    retentionPeriod: 30 # in days
    observers:
      - id: Cluster
        enabled: true
        log: true
        frequency: "*/10 * * * * *"
      - id: Broker
        enabled: false
        frequency: "*/10 * * * * *"
      - id: Topic
        enabled: false
        frequency: "*/10 * * * * *"
      - id: Consumer
        enabled: false
        frequency: "*/10 * * * * *"
  services:
    connection:
      implementation: "ConnectionService"
  # Other origins (scheme://host:port) allowed to call the API from a browser. None by default: the UI is served from
  # the same origin. The dev profile allows the Angular dev server.
  cors:
    allowed-origins: []

server:
  servlet:
    session:
      cookie:
        # Cookies are shared by every port on the same host, and "SESSION" is the default name of every Spring
        # Session app: another one on localhost (e.g. kafka-ui) deletes a SESSION cookie it doesn't recognise,
        # which signed Kafkador users out of their connection. A unique name keeps the two apart.
        name: KAFKADOR_SESSION
        same-site: strict
        http-only: true

spring:
  application:
    name: dashboard
  messages:
    basename: i18n/messages
  datasource:
    url: jdbc:h2:file:./data/kafkadordb
    driverClassName: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
    # What a new session starts with; the idle timeout from Settings (30 minutes unless changed there, at most 24
    # hours) replaces it on the next API call.
    timeout: 30m
  h2:
    # Off by default: it gives full access to Kafkador's database, saved secrets included. The dev profile turns it on.
    console:
      enabled: false
      path: /kafkador-h2
  jackson:
    default-property-inclusion: non_null
kafkador:
  connectionServiceImplementation:
  # Where first-run setup (see DatabaseCredentialsService) saves the chosen embedded-database
  # username/password, and where every later startup reads them from before the datasource connects
  # (DbCredentialsEnvironmentPostProcessor). Deleting this file does NOT undo the change in the
  # database itself — only the setup wizard's own ALTER USER can do that.
  db-credentials-file: ./data/db-credentials.properties
  # First-run setup can't be claimed by whoever reaches a new instance first (see SetupGuard): set the database
  # credentials up front (KAFKADOR_SETUP_USERNAME / KAFKADOR_SETUP_PASSWORD) to skip the setup page, or the page asks
  # for a one-time token printed to the log at startup (KAFKADOR_SETUP_TOKEN to choose it).
  setup:
    username: ""
    password: ""
    token: ""
    require-token: true
  # Who may use Kafkador: chosen on the setup page and in Settings > Access, unless the mode is set here (e.g.
  # KAFKADOR_ACCESS_MODE), which then applies at every startup. none: no sign-in; database: the admin account below,
  # kept in the database; ldap: LDAP accounts. See AccessService.
  access:
    mode: ""
    admin-username: ""
    admin-password: ""
    ldap:
      url: ""                 # ldap://host:389 or ldaps://host:636
      base-dn: ""             # dc=example,dc=com
      user-dn-pattern: ""     # uid={0},ou=people, relative to base-dn; or leave empty and search:
      user-search-base: ""    # ou=people
      user-search-filter: ""  # (uid={0})
      manager-dn: ""          # an account to search with, if searches can't be anonymous
      manager-password: ""
  observerService: # TODO: move to database enable per cluster. the config record must create when the cluster record created
    enabled: false
    retentionPeriod: 30 # in days
    observers:
      - id: Cluster
        enabled: true
        log: true
        frequency: "*/10 * * * * *"
      - id: Broker
        enabled: false
        frequency: "*/10 * * * * *"
      - id: Topic
        enabled: false
        frequency: "*/10 * * * * *"
      - id: Consumer
        enabled: false
        frequency: "*/10 * * * * *"
  services:
    connection:
      implementation: "ConnectionService"
  # Other origins (scheme://host:port) allowed to call the API from a browser. None by default: the UI is served from
  # the same origin. The dev profile allows the Angular dev server.
  cors:
    allowed-origins: []
  # Live mode of the Records tab: each view holds a thread and a Kafka consumer on the server.
  records:
    live:
      max-per-session: 3
      max-total: 20
      max-duration: 30m

management:
  # Only /actuator/health, for the Docker healthcheck, and only UP or DOWN: details would describe the setup to anyone.
  # It counts Kafkador's own database, not the Kafka clusters it connects to, which may come and go.
  endpoints:
    access:
      default: none
    web:
      discovery:
        enabled: false
      exposure:
        include: health
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never

server:
  servlet:
    session:
      cookie:
        # Cookies are shared by every port on the same host, and "SESSION" is the default name of every Spring
        # Session app: another one on localhost (e.g. kafka-ui) deletes a SESSION cookie it doesn't recognise,
        # which signed Kafkador users out of their connection. A unique name keeps the two apart.
        name: KAFKADOR_SESSION
        same-site: strict
        http-only: true

spring:
  application:
    name: dashboard
  messages:
    basename: i18n/messages
  datasource:
    url: jdbc:h2:file:./data/kafkadordb
    driverClassName: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
    # What a new session starts with; the idle timeout from Settings (30 minutes unless changed there, at most 24
    # hours) replaces it on the next API call.
    timeout: 30m
  h2:
    # Off by default: it gives full access to Kafkador's database, saved secrets included. The dev profile turns it on.
    console:
      enabled: false
      path: /kafkador-h2
  jackson:
    default-property-inclusion: non_null
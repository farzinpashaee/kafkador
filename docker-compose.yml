# Kafkador - Kafka dashboard (UI + API in one container)
#
#   docker compose up -d        -> http://localhost:8080
#
# Optional settings can go in a .env file next to this one (see .env.example).

services:
  kafkador:
    image: codestreamlab/kafkador:${KAFKADOR_VERSION:-latest}
    container_name: kafkador
    restart: unless-stopped
    ports:
      - "${KAFKADOR_PORT:-8080}:8080"
    environment:
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0}
    volumes:
      # Connections, settings and sessions (H2 database) survive restarts and upgrades.
      - kafkador-data:/app/data
    extra_hosts:
      # Lets the container reach a Kafka broker running on the host machine as host.docker.internal
      # (built in on Docker Desktop; this line makes it work on Linux too).
      - "host.docker.internal:host-gateway"

volumes:
  kafkador-data:

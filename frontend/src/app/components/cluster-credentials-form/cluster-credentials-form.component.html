<div class="row g-2 mb-3">
  <div class="col-6">
    <label [for]="idPrefix + 'Protocol'" class="form-label">Security protocol:</label>
    <select [id]="idPrefix + 'Protocol'" class="form-select" [(ngModel)]="credentials.securityProtocol" [name]="idPrefix + 'Protocol'">
      <option *ngFor="let protocol of protocols" [ngValue]="protocol.value">{{ protocol.label }}</option>
    </select>
  </div>
  <div class="col-6">
    <label [for]="idPrefix + 'Mechanism'" class="form-label">SASL mechanism:</label>
    <select [id]="idPrefix + 'Mechanism'" class="form-select" [(ngModel)]="credentials.saslMechanism" [name]="idPrefix + 'Mechanism'">
      <option *ngFor="let mechanism of mechanisms" [ngValue]="mechanism.value">{{ mechanism.label }}</option>
    </select>
  </div>
  <div class="col-12 form-text mt-1">Match the broker listener you connect to, e.g. SASL_PLAINTEXT with PLAIN for a local test setup.</div>
</div>
<div class="mb-3">
  <label [for]="idPrefix + 'Username'" class="form-label">Username:</label>
  <input [id]="idPrefix + 'Username'" type="text" class="form-control" autocomplete="username" spellcheck="false"
         [(ngModel)]="credentials.username" [name]="idPrefix + 'Username'">
</div>
<div class="mb-3">
  <label [for]="idPrefix + 'Password'" class="form-label">Password:</label>
  <input [id]="idPrefix + 'Password'" type="password" class="form-control" autocomplete="current-password"
         [(ngModel)]="credentials.password" [name]="idPrefix + 'Password'">
  <div class="form-text">Kept in server memory for this session only, never saved. You'll be asked again after disconnecting.</div>
</div>

<nav *ngIf="totalItems > 0" aria-label="Pagination" class="d-flex align-items-center justify-content-between flex-wrap gap-2 pagination-nav">
  <span class="text-s text-color-subtle">Showing {{ rangeStart }}&ndash;{{ rangeEnd }} of {{ totalItems }}</span>

  <ul class="pagination pagination-sm mb-0" *ngIf="totalPages > 1">
    <li class="page-item" [class.disabled]="page === 1">
      <button type="button" class="page-link" (click)="goTo(page - 1)" [disabled]="page === 1" aria-label="Previous page">
        <i class="bi bi-chevron-left" aria-hidden="true"></i>
      </button>
    </li>
    <li class="page-item" *ngIf="pages[0] > 1">
      <button type="button" class="page-link" (click)="goTo(1)">1</button>
    </li>
    <li class="page-item disabled" *ngIf="pages[0] > 2">
      <span class="page-link">&hellip;</span>
    </li>
    <li class="page-item" *ngFor="let p of pages" [class.active]="p === page">
      <button type="button" class="page-link" (click)="goTo(p)" [attr.aria-current]="p === page ? 'page' : null">
        {{ p }}
        <span class="visually-hidden" *ngIf="p === page">(current)</span>
      </button>
    </li>
    <li class="page-item disabled" *ngIf="pages[pages.length - 1] < totalPages - 1">
      <span class="page-link">&hellip;</span>
    </li>
    <li class="page-item" *ngIf="pages[pages.length - 1] < totalPages">
      <button type="button" class="page-link" (click)="goTo(totalPages)">{{ totalPages }}</button>
    </li>
    <li class="page-item" [class.disabled]="page === totalPages">
      <button type="button" class="page-link" (click)="goTo(page + 1)" [disabled]="page === totalPages" aria-label="Next page">
        <i class="bi bi-chevron-right" aria-hidden="true"></i>
      </button>
    </li>
  </ul>
</nav>
